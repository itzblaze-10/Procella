    - heading "Traps found while testing" [level=3] [ref=e215]
    - generic [ref=e216]:
      - term [ref=e217]: Month key 13
      - definition [ref=e218]: Each POWER year has keys 01 to 12 plus 13. Key 13 is the annual mean. Mixing it into a monthly series corrupts the trend, so we use it only as the annual value.
      - term [ref=e219]: Fill value -999
      - definition [ref=e220]:
        - text: Missing data arrives as
        - code [ref=e221]: "-999"
        - text: . It becomes "missing" before any maths.
      - term [ref=e222]: Different start years
      - definition [ref=e223]:
        - text: Each variable starts at its own year. Surface solar radiation returned
        - code [ref=e224]: "-999"
        - text: for 1981. The app stores a first valid year per variable.
      - term [ref=e225]: NDVI scaling
      - definition [ref=e226]:
        - text: MODIS NDVI needs scale factor
        - code [ref=e227]: "0.0001"
        - text: and ignores fill value
        - code [ref=e228]: "-3000"
        - text: . Both were read from the service's band list.
      - term [ref=e229]: Model, not instrument
      - definition [ref=e230]: POWER values come from MERRA-2 and CERES models. The app says so on every result, and one lat/lon means one grid cell of about 0.5 by 0.625 degrees.

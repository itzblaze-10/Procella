  - generic [ref=e261]:
    - generic [ref=e262]:
      - generic [ref=e263]: 4 · The test
      - heading "How a trend gets its verdict" [level=2] [ref=e264]
      - paragraph [ref=e265]: "Challenge wording: \"determine whether these changes are significant\". We use the Mann-Kendall test, which makes no assumption about the shape of the data."
    - generic [ref=e266]:
      - term [ref=e267]: Mann-Kendall
      - definition [ref=e268]:
        - text: Compare every pair of years. Count pairs where the later year is higher, subtract pairs where it is lower. That count is
        - code [ref=e269]: S
        - text: . A large positive or negative
        - code [ref=e270]: S
        - text: means a steady direction.
        - code [ref=e271]: S
        - text: becomes
        - code [ref=e272]: Z
        - text: with a tie correction, and
        - code [ref=e273]: Z
        - text: becomes a two-sided
        - code [ref=e274]: p
        - text: .
      - term [ref=e275]: Sen's slope
      - definition [ref=e276]: The median of the slope between every pair of years. It is the rate of change per year, and a few extreme years barely move it.
      - term [ref=e277]: Verdict
      - definition [ref=e278]:
        - text: Detected when
        - code [ref=e279]: p
        - text: is below 0.05 and there are at least 15 years. Too short to judge under 15 years. Otherwise not detectable yet. "Not detectable" means the change cannot be told apart from yearly noise at this record length. It does not mean nothing changed.
      - term [ref=e280]: Proof it works
      - definition [ref=e281]:
        - code [ref=e282]: S
        - text: ","
        - code [ref=e283]: Z
        - text: ","
        - code [ref=e284]: p
        - text: and Sen's slope match
        - code [ref=e285]: pymannkendall
        - text: to nine decimals on the live Gandhinagar series. A self-check ships with the script.
      - term [ref=e286]: Not built yet
      - definition [ref=e287]: A confidence interval on the slope and a correction for year-to-year correlation. Both go into the app's engine.
    - generic [ref=e288]:
      - generic [ref=e289]: python3 scripts/trend.py --selftest python3 scripts/trend.py --lat 23.22 --lon 72.65 --param PRECTOTCORR --start 1981 --end 2025

    - generic [ref=e515]:
      - generic [ref=e516]: 6 · Giovanni path
      - heading "The manual route the brief describes" [level=2] [ref=e517]
      - paragraph [ref=e518]: Giovanni is NASA's own plotting tool and the brief points to it. Menu names below come from memory of the Giovanni guide, so we confirm them on screen once you are signed in.
    - list [ref=e519]:
      - listitem [ref=e520]: You sign in to NASA Earthdata in Chrome, then tell Claude. Claude never types the password.
      - listitem [ref=e521]: Open Giovanni and choose plot type Time Series, Area-Averaged.
      - listitem [ref=e522]: "Search the variable. Examples: MERRA-2 2-meter air temperature, or GPM monthly precipitation."
      - listitem [ref=e523]: Enter a bounding box around Gandhinagar, for example west 72.4, south 23.0, east 72.9, north 23.4.
      - listitem [ref=e524]: Set the dates to January 1981 through December 2025 for monthly products.
      - listitem [ref=e525]: Choose Plot Data to preview, then download the CSV.
      - listitem [ref=e526]:
        - text: Run the CSV through the same Mann-Kendall and Sen's slope code. A CSV input mode for
        - code [ref=e527]: scripts/trend.py
        - text: is a small addition.
    - generic [ref=e528]: Giovanni averages a box. NASA POWER returns one grid cell. If both are run for the same place, expect small differences and say which one a result used.

<!-- @dsCard group="Foundations" height=380 subtitle="41 line icons, 24px grid, 1.75 stroke, drawn in code" -->
<div class="pc-row" id="r" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px"></div>
<script>document.getElementById("r").innerHTML = Procella.icons.map(function (n) { return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)">' + Procella.Icon(n, {size: 28}) + '<span style="font:400 11px var(--font-mono);color:var(--ink-muted)">' + n + "</span></div>"; }).join("");</script>
